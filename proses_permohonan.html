<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil | BLUD Jawa Timur</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/profil.css" />
  </head>
  <body>
    <!-- Header / Navbar -->
    <header class="navbar">
      <div class="navbar-left">
        <img src="images/logo.png" alt="Logo BLUD Jatim" class="navbar-logo" />
        <div class="breadcrumb">
          <span>Application</span>
          <span class="separator">></span>
          <span class="active">Profil</span>
        </div>
      </div>
      <div class="navbar-right">
        <div class="navbar-actions">
          <div class="search-box">
            <input type="text" placeholder="Search..." />
            <button class="search-btn">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path
                  d="M9 17A8 8 0 1 0 9 1a8 8 0 0 0 0 16zM19 19l-4.35-4.35"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
          <button class="notification-btn">
            <svg width="20" height="22" viewBox="0 0 20 22" fill="none">
              <path
                d="M16 7A6 6 0 1 0 4 7c0 7-3 9-3 9h18s-3-2-3-9zM11.73 20a2 2 0 0 1-3.46 0"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span class="notification-badge"></span>
          </button>
          <div class="user-avatar"></div>
        </div>
      </div>
    </header>

    <div class="main-container">
      <!-- Sidebar -->
      <aside class="sidebar">
        <nav class="sidebar-nav">
          <!-- Item: Data Permohonan -->
          <a href="#" class="nav-item active">
            <img 
              src="images/icon_user.png" 
              alt="icon_user" 
              width="24" 
              height="24" 
            />
            <span>Profil</span>
          </a>
      
          <!-- Item: Monitoring -->
          <div class="nav-item">
            <img 
              src="images/icon_monitoring.png" 
              alt="Monitoring Icon" 
              width="24" 
              height="24" 
            />
            <span>Monitoring</span>
            <svg class="chevron" width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path
                d="M6 12l4-4-4-4"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
        </nav>
      </aside>

      <!-- Main Content -->
      <main class="content">
        <h2 class="profile-title">Profil</h2>

        <div class="profile-card">

          <div class="profile-content">
            <div class="profile-header">
              <img
                src="images/logo-sekolah.png"
                alt="Logo Institusi"
                class="profile-logo"
              />
              <div class="profile-info">
                <h3 class="institution-name">SMK Negeri 1 Bisa Maju</h3>
                <p class="role">Sekretariat (Admin)</p>
                <div class="location-info">
                  <div class="info-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                      <path
                        d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9z"
                        stroke="#666"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      />
                      <path
                        d="M9 22V12h6v10"
                        stroke="#666"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      />
                    </svg>
                    <span>Surabaya, Jawa Timur</span>
                  </div>
                  <div class="info-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                      <path
                        d="M22 10v6M2 10l10-5 10 5-10 5z"
                        stroke="#666"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      />
                      <path
                        d="M6 12v5c3 2 7 2 10 0v-5"
                        stroke="#666"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      />
                    </svg>
                    <span>Biro Perekonomian</span>
                  </div>
                </div>
              </div>
            </div>

            <div class="notification-box">
              <p>
                Permohonan pendirian BLUD telah diajukan pada
                <span class="date">16-10-2025</span>
              </p>
              <!-- <button class="btn-lihat-permohonan">Lihat Permohonan</button> -->
               <a href="proses_disetujui.html" class="btn-lihat-permohonan">Lihat Permohonan</a>
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
