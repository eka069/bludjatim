<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil | BLUD Jawa Timur</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="../../assets/css/blud/form.css" />
  </head>
  <body>
    <!-- Header / Navbar -->
    <header class="navbar">
      <div class="navbar-left">
        <img src="../../assets/img/logo.png" alt="Logo BLUD Jatim" class="navbar-logo" />
        <div class="breadcrumb">
          <span>Application</span>
          <span class="separator">></span>
          <span class="active">Profil</span>
        </div>
      </div>

      <div class="navbar-right">
        <div class="navbar-actions">
          <div class="search-box">
            <input type="text" placeholder="Search..." />
            <button class="search-btn">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path
                  d="M9 17A8 8 0 1 0 9 1a8 8 0 0 0 0 16zM19 19l-4.35-4.35"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg>
            </button>
          </div>

          <button class="notification-btn">
            <svg width="20" height="22" viewBox="0 0 20 22" fill="none">
              <path
                d="M16 7A6 6 0 1 0 4 7c0 7-3 9-3 9h18s-3-2-3-9zM11.73 20a2 2 0 0 1-3.46 0"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span class="notification-badge"></span>
          </button>
          <div class="user-avatar"></div>
        </div>
      </div>
    </header>

    <div class="main-container">
      <!-- Sidebar -->
      <aside class="sidebar">
        <nav class="sidebar-nav">
          <a href="#" class="nav-item active">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path
                d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span>Profil</span>
          </a>
           <!-- Item: Monitoring -->
           <div class="nav-item">
            <img 
              src="../../assets/img/monitoringbiru.png" 
              alt="Monitoring Icon" 
              width="24" 
              height="24" 
            />
            <span>Monitoring</span>
            <svg class="chevron" width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path
                d="M6 12l4-4-4-4"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
        </nav>
      </aside>

      <!-- Main Content -->
      <div class="content">
        <h2 class="profile-title">Profil</h2>
        <div class="profile-card">
      
          <div class="profile-content">
            <div class="profile-header">
              <img src="../../assets/img/logo smk.jpg" alt="Logo Institusi" class="profile-logo" />
              <div class="profile-info">
                <h3 class="institution-name">SMK Negeri 1 Bisa Maju</h3>
                <p class="role">Sekretariat (Admin)</p>
                <div class="location-info">
                  <div class="info-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9z" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                      <path d="M9 22V12h6v10" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    <span>Surabaya, Jawa Timur</span>
                  </div>
                  <div class="info-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                      <path d="M22 10v6M2 10l10-5 10 5-10 5z" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                      <path d="M6 12v5c3 2 7 2 10 0v-5" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    <span>Biro Perekonomian</span>
                  </div>
                </div>
              </div>
            </div>
      
            <!-- TAB -->
            <div class="tab">
              <button class="active" type="button">Pendirian</button>
            </div>
      
            <!-- FORM CONTAINER (scrollable) -->
            <div class="form-container">
              <div class="form-group">
                <label for="latar-belakang">Latar Belakang</label>
                <div class="editor">
                  <div class="toolbar" role="toolbar" aria-label="Editor toolbar">
                    <button type="button" title="Rata Kiri">☰</button>
                    <button type="button" title="Rata Tengah">≡</button>
                    <button type="button" title="Rata Kanan">≣</button>
                    <button type="button" title="Rata Kanan-Kiri">≜</button>
                    <button type="button" title="Tebal"><strong>B</strong></button>
                    <button type="button" title="Miring"><em>I</em></button>
                    <button type="button" title="Garis Bawah"><u>U</u></button>
                    <button type="button" title="Mata Uang">$</button>
                    <button type="button" title="Gambar">🖼️</button>
                    <button type="button" title="Simbol">∑</button>
                    <button type="button" title="Daftar Tidak Berurut">•</button>
                    <button type="button" title="Daftar Berurut">1.</button>
                    <button type="button" title="Ukuran Font">T</button>
                    <button type="button" title="Warna Teks">✎</button>
                    <button type="button" title="Simpan">✔</button>
                  </div>
                  <textarea rows="6" placeholder="Tulis latar belakang pengajuan di sini..."></textarea>
                </div>
              </div>
      
              <!-- PERSYARATAN UPLOAD -->
              <h4>Persyaratan :</h4>
      
              <div class="form-group">
                <label>Dokumen substantif dan teknis<span class="req">*</span></label>
                <input type="file" />
              </div>
      
              <div class="form-group">
                <label>Surat Permohonan<span class="req">*</span></label>
                <input type="file" />
              </div>
      
              <div class="form-group">
                <label>Surat pernyataan kesanggupan untuk meningkatkan kinerja<span class="req">*</span></label>
                <input type="file" />
              </div>
      
              <div class="form-group">
                <label>Pola Tata Kelola<span class="req">*</span></label>
                <input type="file" />
              </div>
      
              <div class="form-group">
                <label>Rencana Strategi BLUD<span class="req">*</span></label>
                <input type="file" />
              </div>
      
              <div class="form-group">
                <label>Standar Pelayanan Minimal<span class="req">*</span></label>
                <input type="file" />
              </div>
      
              <div class="form-group">
                <label>Laporan keuangan atau prognosis/proyeksi keuangan<span class="req">*</span></label>
                <input type="file" />
              </div>
      
              <div class="form-group">
                <label>Laporan audit terakhir atau pernyataan bersedia diaudit oleh pemeriksa eksternal pemerintah<span class="req">*</span></label>
                <input type="file" />
              </div>
      
              <div class="actions">
                <button class="btn-primary">Simpan</button>
                <button class="btn-secondary">Batal</button>
              </div>              
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
