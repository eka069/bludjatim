<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Pendirian | BLUD Jawa Timur</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Reusable CSS -->
    <link rel="stylesheet" href="/assets/css/template.css" />
    <link rel="stylesheet" href="/assets/css/sidebar.css" />

    <link rel="stylesheet" href="/assets/css/blud/form.css" />
  </head>
  <body>
    <!-- NAVBAR -->
    <nav class="navbar-custom w-100">
      <div class="container-fluid p-0">
        <div class="d-flex align-items-center justify-content-between w-100">
          <div class="d-flex align-items-center">
            <button class="hamburger-menu" onclick="toggleSidebar()">
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
              >
                <path
                  d="M3 12h18M3 6h18M3 18h18"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
            </button>
            <img
              src="/assets/img/logo.png"
              alt="Logo BLUD"
              class="navbar-logo-img"
              onerror="this.style.display='none'"
            />
            <div class="breadcrumb-custom">
              <span>Application</span>
              <span class="separator">></span>
              <span class="active">Profil</span>
            </div>
          </div>

          <div class="d-flex align-items-center gap-3">
            <div class="search-box-custom">
              <input
                type="text"
                class="form-control search-input"
                placeholder="Search..."
              />
              <button class="search-btn-custom">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                  <path
                    d="M9 17A8 8 0 1 0 9 1a8 8 0 0 0 0 16zM19 19l-4.35-4.35"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
            </div>

            <button class="notification-btn-custom">
              <svg width="22" height="24" viewBox="0 0 20 22" fill="none">
                <path
                  d="M16 7A6 6 0 1 0 4 7c0 7-3 9-3 9h18s-3-2-3-9zM11.73 20a2 2 0 0 1-3.46 0"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <span class="notification-badge"></span>
            </button>

            <div class="user-avatar">A</div>
          </div>
        </div>
      </div>
    </nav>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <div class="main-container w-100">
      <div class="box-background"></div>
      <div class="container-fluid content-container position-relative p-0 w-100 h-100 d-flex">
        <!-- Sidebar -->
        <aside class="sidebar-custom" id="sidebar">
          <nav class="sidebar-nav">
            <a href="#" class="nav-item-custom active">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path
                  d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <span>Profil</span>
            </a>

            <div class="nav-item-custom">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span>Monitoring</span>
              <svg
                class="chevron"
                width="16"
                height="16"
                viewBox="0 0 16 16"
                fill="none"
              >
                <path
                  d="M6 12l4-4-4-4"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </div>
          </nav>
        </aside>

        <!-- Content -->
        <div class="content-inner">
          <!-- Profile Header -->
          <div class="profile-header">
            <img 
              src="/assets/img/logo smk.jpg" 
              alt="Logo Institusi" 
              class="profile-logo" 
              onerror="this.style.display='none'" 
            />
            <div class="profile-info">
              <h3 class="institution-name">SMK Negeri 1 Bisa Maju</h3>
              <p class="role">Sekretariat (Admin)</p>
              <div class="location-info">
                <div class="info-item">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                    <path 
                      d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9z" 
                      stroke="#6b7280" 
                      stroke-width="2" 
                      stroke-linecap="round" 
                      stroke-linejoin="round" 
                    />
                    <path 
                      d="M9 22V12h6v10" 
                      stroke="#6b7280" 
                      stroke-width="2" 
                      stroke-linecap="round" 
                      stroke-linejoin="round" 
                    />
                  </svg>
                  <span>Surabaya, Jawa Timur</span>
                </div>
                <div class="info-item">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                    <path 
                      d="M22 10v6M2 10l10-5 10 5-10 5z" 
                      stroke="#6b7280" 
                      stroke-width="2" 
                      stroke-linecap="round" 
                      stroke-linejoin="round" 
                    />
                    <path 
                      d="M6 12v5c3 2 7 2 10 0v-5" 
                      stroke="#6b7280" 
                      stroke-width="2" 
                      stroke-linecap="round" 
                      stroke-linejoin="round" 
                    />
                  </svg>
                  <span>Biro Perekonomian</span>
                </div>
              </div>
            </div>
          </div>

          <!-- TABS -->
          <div class="tabs-container">
            <div class="tabs">
              <button class="tab active">
                <img 
                  src="/assets/img/icon_pendirian.png" 
                  alt="Pendirian Icon"
                  onerror="this.style.display='none'"
                />
                Pendirian
              </button>
            </div>
          </div>

          <!-- FORM CONTAINER -->
          <div class="form-container">
            <label class="section-title">Latar Belakang</label>
            <div class="editor">
              <div class="toolbar" role="toolbar" aria-label="Editor toolbar">
                <button type="button" title="Rata Kiri">☰</button>
                <button type="button" title="Rata Tengah">≡</button>
                <button type="button" title="Rata Kanan">≣</button>
                <button type="button" title="Rata Kanan-Kiri">≜</button>
                <button type="button" title="Tebal"><strong>B</strong></button>
                <button type="button" title="Miring"><em>I</em></button>
                <button type="button" title="Garis Bawah"><u>U</u></button>
                <button type="button" title="Mata Uang">$</button>
                <button type="button" title="Gambar">🖼️</button>
                <button type="button" title="Simbol">∑</button>
                <button type="button" title="Daftar Tidak Berurut">•</button>
                <button type="button" title="Daftar Berurut">1.</button>
                <button type="button" title="Ukuran Font">T</button>
                <button type="button" title="Warna Teks">✎</button>
                <button type="button" title="Simpan">✔</button>
              </div>
              <textarea 
                id="latar-belakang" 
                rows="6" 
                placeholder="Tulis latar belakang pengajuan di sini..."
              ></textarea>
            </div>

            <!-- PERSYARATAN UPLOAD -->
            <h4 class="requirements-title">Persyaratan :</h4>

            <div class="form-group">
              <label>Dokumen substantif dan teknis<span class="req">*</span></label>
              <input type="file" accept=".pdf,.doc,.docx" />
            </div>

            <div class="form-group">
              <label>Surat Permohonan<span class="req">*</span></label>
              <input type="file" accept=".pdf,.doc,.docx" />
            </div>

            <div class="form-group">
              <label>Surat pernyataan kesanggupan untuk meningkatkan kinerja<span class="req">*</span></label>
              <input type="file" accept=".pdf,.doc,.docx" />
            </div>

            <div class="form-group">
              <label>Pola Tata Kelola<span class="req">*</span></label>
              <input type="file" accept=".pdf,.doc,.docx" />
            </div>

            <div class="form-group">
              <label>Rencana Strategi BLUD<span class="req">*</span></label>
              <input type="file" accept=".pdf,.doc,.docx" />
            </div>

            <div class="form-group">
              <label>Standar Pelayanan Minimal<span class="req">*</span></label>
              <input type="file" accept=".pdf,.doc,.docx" />
            </div>

            <div class="form-group">
              <label>Laporan keuangan atau prognosis/proyeksi keuangan<span class="req">*</span></label>
              <input type="file" accept=".pdf,.doc,.docx" />
            </div>

            <div class="form-group">
              <label>Laporan audit terakhir atau pernyataan bersedia diaudit oleh pemeriksa eksternal pemerintah<span class="req">*</span></label>
              <input type="file" accept=".pdf,.doc,.docx" />
            </div>

            <!-- Action Buttons -->
            <div class="actions">
              <button type="submit" class="btn-primary-custom">Simpan</button>
              <button type="button" class="btn-secondary-custom">Batal</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      // Toggle Sidebar Function
      function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        
        sidebar.classList.toggle('show');
        overlay.classList.toggle('show');
      }

      // Simple text editor functionality
      document.querySelectorAll('.toolbar button').forEach(button => {
        button.addEventListener('click', function() {
          const textarea = this.closest('.editor').querySelector('textarea');
          textarea.focus();
          
          // Add basic formatting feedback
          this.style.backgroundColor = '#e0e7ff';
          setTimeout(() => {
            this.style.backgroundColor = 'white';
          }, 200);
        });
      });
    </script>
  </body>
</html>
