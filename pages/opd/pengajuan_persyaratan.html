<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Persyaratan | BLUD Jawa Timur</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- CSS Files -->
    <link rel="stylesheet" href="/assets/css/template.css" />
    <link rel="stylesheet" href="/assets/css/sidebar.css" />
    <link rel="stylesheet" href="/assets/css/opd/pengajuan_persyaratan.css" />
  </head>
  <body>
    <!-- NAVBAR -->
    <nav class="navbar-custom w-100">
      <div class="container-fluid p-0">
        <div class="d-flex align-items-center justify-content-between w-100">
          <div class="d-flex align-items-center">
            <button class="hamburger-menu" onclick="toggleSidebar()">
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
              >
                <path
                  d="M3 12h18M3 6h18M3 18h18"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
            </button>
            <img
              src="/assets/img/logo.png"
              alt="Logo BLUD"
              class="navbar-logo-img"
              onerror="this.style.display='none'"
            />
            <div class="breadcrumb-custom">
              <span>Application</span>
              <span class="separator">></span>
              <span class="active">Form Pengajuan</span>
            </div>
          </div>

          <div class="d-flex align-items-center gap-3">
            <div class="search-box-custom">
              <input
                type="text"
                class="form-control search-input"
                placeholder="Search..."
              />
              <button class="search-btn-custom">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                  <path
                    d="M9 17A8 8 0 1 0 9 1a8 8 0 0 0 0 16zM19 19l-4.35-4.35"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
            </div>

            <button class="notification-btn-custom">
              <svg width="22" height="24" viewBox="0 0 20 22" fill="none">
                <path
                  d="M16 7A6 6 0 1 0 4 7c0 7-3 9-3 9h18s-3-2-3-9zM11.73 20a2 2 0 0 1-3.46 0"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <span class="notification-badge"></span>
            </button>

            <div class="user-avatar">A</div>
          </div>
        </div>
      </div>
    </nav>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- Main Container -->
    <div class="main-container w-100">
      <div class="box-background"></div>
      <div class="container-fluid content-container position-relative p-0 w-100 h-100 d-flex justify-content-between align-items-start">
        
        <!-- Sidebar -->
        <aside class="sidebar-custom" id="sidebar">
          <nav class="sidebar-nav">
            <a href="/dashboard.html" class="nav-item-custom">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M9 22V12h6v10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              <span>Dashboard</span>
            </a>

            <a href="/pages/opd/usulan_pendirian.html" class="nav-item-custom active">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 12h2a2 2 0 1 0 0-4h-3c-.6 0-1.1.2-1.4.6L3 14" />
                <path d="m7 18 1.6-1.4c.3-.4.8-.6 1.4-.6h4c1.1 0 2.1-.4 2.8-1.2l4.6-4.4a2 2 0 0 0-2.75-2.91l-4.2 3.9" />
                <path d="m2 13 6 6" />
              </svg>
              <span>Usulan Pendirian</span>
            </a>

            <a href="/pages/blud/profil.html" class="nav-item-custom">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                <circle cx="12" cy="7" r="4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              <span>Profil</span>
            </a>
          </nav>
        </aside>

        <!-- Content Area -->
        <div class="content-inner bg-white h-100">
          <!-- Form Tabs -->
          <div class="form-tabs">
            <button class="form-tab" data-tab="data-calon" onclick="window.location.href='pengajuan_data.html'">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>
              </svg>
              Data Calon BLUD
            </button>
            <button class="form-tab active" data-tab="persyaratan">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 11l3 3L22 4"/>
                <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
              </svg>
              Persyaratan
            </button>
            <button class="form-tab" data-tab="penilaian" onclick="alert('Halaman Penilaian belum tersedia')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
              </svg>
              Penilaian
            </button>
            <button class="form-tab" data-tab="log" onclick="alert('Halaman Log belum tersedia')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <path d="M14 2v6h6M12 18v-6M9 15h6"/>
              </svg>
              Log
            </button>
          </div>

          <!-- Form Content -->
          <div class="form-content">
            <form id="formPersyaratan">
              <!-- Latar Belakang -->
              <div class="form-group">
                <label class="form-label">Latar Belakang</label>
                <div class="editor-toolbar">
                  <button type="button" class="editor-btn" title="Align Left">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <line x1="17" y1="10" x2="3" y2="10"></line>
                      <line x1="21" y1="6" x2="3" y2="6"></line>
                      <line x1="21" y1="14" x2="3" y2="14"></line>
                      <line x1="17" y1="18" x2="3" y2="18"></line>
                    </svg>
                  </button>
                  <button type="button" class="editor-btn" title="Align Center">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <line x1="18" y1="10" x2="6" y2="10"></line>
                      <line x1="21" y1="6" x2="3" y2="6"></line>
                      <line x1="21" y1="14" x2="3" y2="14"></line>
                      <line x1="18" y1="18" x2="6" y2="18"></line>
                    </svg>
                  </button>
                  <button type="button" class="editor-btn" title="Align Right">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <line x1="21" y1="10" x2="7" y2="10"></line>
                      <line x1="21" y1="6" x2="3" y2="6"></line>
                      <line x1="21" y1="14" x2="3" y2="14"></line>
                      <line x1="21" y1="18" x2="7" y2="18"></line>
                    </svg>
                  </button>
                  <button type="button" class="editor-btn" title="Justify">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <line x1="21" y1="10" x2="3" y2="10"></line>
                      <line x1="21" y1="6" x2="3" y2="6"></line>
                      <line x1="21" y1="14" x2="3" y2="14"></line>
                      <line x1="21" y1="18" x2="3" y2="18"></line>
                    </svg>
                  </button>
                  <span class="editor-divider"></span>
                  <button type="button" class="editor-btn" title="Bold"><strong>B</strong></button>
                  <button type="button" class="editor-btn" title="Italic"><em>I</em></button>
                  <button type="button" class="editor-btn" title="Underline"><u>U</u></button>
                  <button type="button" class="editor-btn" title="Strikethrough"><s>S</s></button>
                </div>
                <textarea 
                  class="form-control-custom editor-textarea" 
                  id="latarBelakang"
                  rows="6"
                  required
                ></textarea>
              </div>

              <!-- Persyaratan Title -->
              <div class="persyaratan-section">
                <h3 class="section-title">Persyaratan :</h3>

                <!-- Dokumen substantif dan teknis -->
                <div class="file-upload-group">
                  <label class="file-label">
                    Dokumen substantif dan teknis<span class="required">*</span>
                  </label>
                  <div class="file-upload-wrapper">
                    <input type="file" id="dokumenSubstantif" class="file-input" required />
                    <label for="dokumenSubstantif" class="file-upload-label">
                      <span class="file-btn">Choose File</span>
                      <span class="file-name">No file chosen</span>
                    </label>
                  </div>
                </div>

                <!-- Surat Permohonan -->
                <div class="file-upload-group">
                  <label class="file-label">
                    Surat Permohonan<span class="required">*</span>
                  </label>
                  <div class="file-upload-wrapper">
                    <input type="file" id="suratPermohonan" class="file-input" required />
                    <label for="suratPermohonan" class="file-upload-label">
                      <span class="file-btn">Choose File</span>
                      <span class="file-name">No file chosen</span>
                    </label>
                  </div>
                </div>

                <!-- Surat pernyataan kesanggupan -->
                <div class="file-upload-group">
                  <label class="file-label">
                    Surat pernyataan kesanggupan untuk meningkatkan kinerja<span class="required">*</span>
                  </label>
                  <div class="file-upload-wrapper">
                    <input type="file" id="suratKesanggupan" class="file-input" required />
                    <label for="suratKesanggupan" class="file-upload-label">
                      <span class="file-btn">Choose File</span>
                      <span class="file-name">No file chosen</span>
                    </label>
                  </div>
                </div>

                <!-- Pola Tata Kelola -->
                <div class="file-upload-group">
                  <label class="file-label">
                    Pola Tata Kelola<span class="required">*</span>
                  </label>
                  <div class="file-upload-wrapper">
                    <input type="file" id="polaTataKelola" class="file-input" required />
                    <label for="polaTataKelola" class="file-upload-label">
                      <span class="file-btn">Choose File</span>
                      <span class="file-name">No file chosen</span>
                    </label>
                  </div>
                </div>

                <!-- Rencana Strategi BLUD -->
                <div class="file-upload-group">
                  <label class="file-label">
                    Rencana Strategi BLUD<span class="required">*</span>
                  </label>
                  <div class="file-upload-wrapper">
                    <input type="file" id="rencanaStrategi" class="file-input" required />
                    <label for="rencanaStrategi" class="file-upload-label">
                      <span class="file-btn">Choose File</span>
                      <span class="file-name">No file chosen</span>
                    </label>
                  </div>
                </div>

                <!-- Standar Pelayanan Minimal -->
                <div class="file-upload-group">
                  <label class="file-label">
                    Standar Pelayanan Minimal<span class="required">*</span>
                  </label>
                  <div class="file-upload-wrapper">
                    <input type="file" id="standarPelayanan" class="file-input" required />
                    <label for="standarPelayanan" class="file-upload-label">
                      <span class="file-btn">Choose File</span>
                      <span class="file-name">No file chosen</span>
                    </label>
                  </div>
                </div>

                <!-- Laporan keuangan -->
                <div class="file-upload-group">
                  <label class="file-label">
                    Laporan keuangan atau prognosis/proyeksi keuangan
                  </label>
                  <div class="file-upload-wrapper">
                    <input type="file" id="laporanKeuangan" class="file-input" />
                    <label for="laporanKeuangan" class="file-upload-label">
                      <span class="file-btn">Choose File</span>
                      <span class="file-name">No file chosen</span>
                    </label>
                  </div>
                </div>

                <!-- Laporan audit -->
                <div class="file-upload-group">
                  <label class="file-label">
                    Laporan audit terakhir atau pernyataan bersedia untuk diaudit oleh pemeriksa eksternal pemerintah
                  </label>
                  <div class="file-upload-wrapper">
                    <input type="file" id="laporanAudit" class="file-input" />
                    <label for="laporanAudit" class="file-upload-label">
                      <span class="file-btn">Choose File</span>
                      <span class="file-name">No file chosen</span>
                    </label>
                  </div>
                </div>
              </div>

              <!-- Form Actions -->
              <div class="form-actions">
                <button class="btn-custom btn-outline" type="button" onclick="location.href='list_permohonan.html'">
                  Batal
                </button>
                <button class="btn-custom btn-secondary" type="button" onclick="simpanDraft()">Simpan</button>
                <button class="btn-custom btn-primary" type="submit">Submit</button>
              </div>
            </form>
          </div>
        </div>

      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Sidebar JS -->
    <script src="/assets/js/sidebar.js"></script>
    
    <!-- Tab Navigation JS -->
    <script src="/assets/js/tab-navigation.js"></script>
    
    <!-- Form JS -->
    <script src="/assets/js/pengajuan_persyaratan.js"></script>
  </body>
</html>
