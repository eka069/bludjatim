        {no: "4.1.5", text: "Perputaran Aset Tetap (Fix Asset Turnover)", level: 3, hasChildren: false, parent: "4.1", rumus: "YA", jenisInput: "Numeric"},
        
        {no: "4.2", text: "Kinerja untuk Memenuhi Seluruh Kewajiban Jangka Pendek", level: 2, hasChildren: true, parent: "4", id: "4.2"},
        {no: "4.2.1", text: "Rasio Kas (Cash Ratio)", level: 3, hasChildren: false, parent: "4.2", rumus: "YA", jenisInput: "Numeric"},
        {no: "4.2.2", text: "Rasio Lancar (Current Ratio)", level: 3, hasChildren: false, parent: "4.2", rumus: "YA", jenisInput: "Numeric"},
        
        {no: "4.3", text: "Kinerja dari Kemampuan Pendapatan BLUD untuk Membiayai Pengeluaran", level: 2, hasChildren: true, parent: "4", id: "4.3"},
        {no: "4.3.1", text: "Rasio Pendapatan BLUD non APBD-LO terhadap Biaya Operasional/Cost Recovery Rate", level: 3, hasChildren: false, parent: "4.3", rumus: "YA", jenisInput: "Numeric"},
        {no: "4.3.2", text: "Pertumbuhan Pendapatan", level: 3, hasChildren: false, parent: "4.3", rumus: "YA", jenisInput: "Numeric"},
        {no: "4.3.3", text: "Rasio Penyerapan Anggaran Belanja", level: 3, hasChildren: false, parent: "4.3", rumus: "YA", jenisInput: "Numeric"},
    ];

    // Generate table HTML
    function generateTable() {
        const tbody = document.getElementById('tableData');
        tbody.innerHTML = '';
        
        treeData.forEach(item => {
            const tr = document.createElement('tr');
            tr.className = `level-${item.level}`;
            if (item.parent) tr.setAttribute('data-parent', item.parent);
            if (item.id) tr.setAttribute('data-id', item.id);
            
            // Background colors
            const bgColors = {
                1: '#d1f0e1',
                2: '#fff9db',
                3: '#fef3e2',
                4: '#fffcf5'
            };
            tr.style.backgroundColor = bgColors[item.level] || '#ffffff';
            
            // Nomor
            const tdNo = document.createElement('td');
            tdNo.style.textAlign = 'center';
            tdNo.style.fontWeight = '600';
            tdNo.textContent = item.no;
            tr.appendChild(tdNo);
            
            // Indikator dengan tree structure
            const tdIndikator = document.createElement('td');
            const indicator = document.createElement('div');
            indicator.className = 'tree-indicator';
            indicator.style.paddingLeft = `${(item.level - 1) * 20}px`;
            indicator.style.display = 'flex';
            indicator.style.alignItems = 'center';
            indicator.style.gap = '6px';
            
            if (item.hasChildren) {
                const icon = document.createElement('i');
                icon.className = 'bi bi-caret-down-fill toggle-icon';
                icon.style.fontSize = '12px';
                icon.style.color = '#2563eb';
                icon.style.cursor = 'pointer';
                indicator.appendChild(icon);
            } else {
                const bullet = document.createElement('span');
                bullet.textContent = item.level === 4 ? '-' : '•';
                bullet.style.fontSize = '16px';
                bullet.style.color = '#64748b';
                bullet.style.fontWeight = 'bold';
                bullet.style.width = '12px';
                bullet.style.display = 'inline-block';
                bullet.style.textAlign = 'center';
                indicator.appendChild(bullet);
            }
            
            const text = document.createElement('span');
            text.textContent = item.text;
            text.style.fontWeight = item.level <= 2 ? '600' : '400';
            indicator.appendChild(text);
            
            tdIndikator.appendChild(indicator);
            tr.appendChild(tdIndikator);
            
            // Rumus
            const tdRumus = document.createElement('td');
            tdRumus.style.textAlign = 'center';
            tdRumus.textContent = item.rumus || '';
            tr.appendChild(tdRumus);
            
            // Jenis Input
            const tdJenis = document.createElement('td');
            tdJenis.style.textAlign = 'center';
            tdJenis.textContent = item.jenisInput || '';
            tr.appendChild(tdJenis);
            
            // Action buttons
            const tdAction = document.createElement('td');
            tdAction.style.textAlign = 'center';
            tdAction.innerHTML = `
                <button class="btn-action btn-add" style="background:#10b981;color:white;border:none;padding:4px 8px;border-radius:4px;font-size:11px;margin:0 2px;cursor:pointer;"><i class="bi bi-plus-lg"></i></button>
                <button class="btn-action btn-edit" style="background:#fbbf24;color:#1e293b;border:none;padding:4px 8px;border-radius:4px;font-size:11px;margin:0 2px;cursor:pointer;"><i class="bi bi-pencil"></i></button>
                <button class="btn-action btn-delete" style="background:#ef4444;color:white;border:none;padding:4px 8px;border-radius:4px;font-size:11px;margin:0 2px;cursor:pointer;"><i class="bi bi-trash"></i></button>
            `;
            tr.appendChild(tdAction);
            
            tbody.appendChild(tr);
        });
        
        // Add toggle functionality
        document.querySelectorAll('.toggle-icon').forEach(icon => {
            icon.addEventListener('click', function(e) {
                e.stopPropagation();
                const row = this.closest('tr');
                const rowId = row.getAttribute('data-id');
                if (!rowId) return;
                
                this.classList.toggle('collapsed');
                this.style.transform = this.classList.contains('collapsed') ? 'rotate(-90deg)' : 'rotate(0deg)';
                
                toggleChildren(rowId, this.classList.contains('collapsed'));
            });
        });
    }
    
    function toggleChildren(parentId, hide) {
        const rows = document.querySelectorAll(`tr[data-parent="${parentId}"]`);
        rows.forEach(row => {
            row.style.display = hide ? 'none' : '';
            const childId = row.getAttribute('data-id');
            if (childId) {
                const icon = row.querySelector('.toggle-icon');
                if (icon && hide) {
                    icon.classList.add('collapsed');
                    icon.style.transform = 'rotate(-90deg)';
                }
                toggleChildren(childId, hide);
            }
        });
    }
    
    // Initialize
    generateTable();
    </script>
</body>
</html>
