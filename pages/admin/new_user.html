<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buat User Baru | BLUD Jawa Timur</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Reusable CSS -->
    <link rel="stylesheet" href="/assets/css/template.css" />
    <link rel="stylesheet" href="/assets/css/sidebar.css" />
    <link rel="stylesheet" href="/assets/css/sidebar-submenu.css" />
    <link rel="stylesheet" href="/assets/css/admin/user.css" />
  </head>
  <body>
    <!-- NAVBAR -->
    <nav class="navbar-custom w-100">
      <div class="container-fluid p-0">
        <div class="d-flex align-items-center justify-content-between w-100">
          <div class="d-flex align-items-center">
            <button class="hamburger-menu" onclick="toggleSidebar()">
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
              >
                <path
                  d="M3 12h18M3 6h18M3 18h18"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
            </button>
            <img
              src="/assets/img/logo.png"
              alt="Logo BLUD"
              class="navbar-logo-img"
              onerror="this.style.display='none'"
            />

            <div class="breadcrumb-custom">
              <span>DASHBOARD</span>
              <span class="separator">></span>
              <span>DAFTAR USER</span>
              <span class="separator">></span>
              <span class="active">BUAT USER BARU</span>
            </div>
          </div>

          <div class="d-flex align-items-center gap-3">           
            <button class="notification-btn-custom">
              <svg width="22" height="24" viewBox="0 0 20 22" fill="none">
                <path
                  d="M16 7A6 6 0 1 0 4 7c0 7-3 9-3 9h18s-3-2-3-9zM11.73 20a2 2 0 0 1-3.46 0"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <span class="notification-badge"></span>
            </button>

            <div class="d-flex align-items-center gap-2">
              <div class="user-avatar">A</div>
              <span class="text-white fw-semibold">ADMINISTRATOR</span>
            </div>            
          </div>
        </div>
      </div>
    </nav>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Main Container -->
    <div class="main-container w-100">
      <div class="box-background"></div>
      <div class="container-fluid content-container position-relative p-0 w-100 h-100 d-flex justify-content-between align-items-start">
        
        <!-- Sidebar -->
        <aside class="sidebar-custom" id="sidebar">
          <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item-custom">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M9 22V12h6v10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span>Dashboard</span>
            </a>

            <!-- Managemen User dengan Submenu -->
            <div>
              <a href="#" class="nav-item-custom has-active-submenu expanded" onclick="toggleSubmenu(event, 'userSubmenu')">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" stroke-linecap="round" stroke-linejoin="round"/>
                  <circle cx="9" cy="7" r="4" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M23 21v-2a4 4 0 0 0-3-3.87" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M16 3.13a4 4 0 0 1 0 7.75" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>MANAGEMEN USER</span>
                <svg class="chevron" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor">
                  <path d="M4 6l4 4 4-4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </a>
              
              <div class="submenu show" id="userSubmenu">
                <a href="user.html" class="submenu-item active">USER</a>
              </div>
            </div>

            <!-- Master dengan Submenu -->
            <div>
              <a href="#" class="nav-item-custom" onclick="toggleSubmenu(event, 'masterSubmenu')">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="3" width="18" height="18" rx="2" ry="2" stroke-linecap="round" stroke-linejoin="round"/>
                  <line x1="9" y1="3" x2="9" y2="21" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>MASTER</span>
                <svg class="chevron" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor">
                  <path d="M4 6l4 4 4-4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </a>
              
              <div class="submenu" id="masterSubmenu">
                <a href="#" class="submenu-item">DOKUMEN SYARAT</a>
                <a href="#" class="submenu-item">OPD</a>
                <a href="#" class="submenu-item">BIDANG</a>
                <a href="#" class="submenu-item">INSTANSI</a>
                <a href="#" class="submenu-item">INDIKATOR EVALUASI</a>
              </div>
            </div>

            <!-- Permohonan dengan Submenu -->
            <div>
              <a href="#" class="nav-item-custom" onclick="toggleSubmenu(event, 'permohonanSubmenu')">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke-linecap="round" stroke-linejoin="round"/>
                  <polyline points="14 2 14 8 20 8" stroke-linecap="round" stroke-linejoin="round"/>
                  <line x1="16" y1="13" x2="8" y2="13" stroke-linecap="round" stroke-linejoin="round"/>
                  <line x1="16" y1="17" x2="8" y2="17" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>PERMOHONAN</span>
                <svg class="chevron" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor">
                  <path d="M4 6l4 4 4-4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </a>
              
              <div class="submenu" id="permohonanSubmenu">
                <a href="list_permohonan.html" class="submenu-item">PERMOHONAN PROSES</a>
              </div>
            </div>

            <!-- Monitoring dengan Submenu -->
            <div>
              <a href="#" class="nav-item-custom" onclick="toggleSubmenu(event, 'monitoringSubmenu')">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>MONITORING</span>
                <svg class="chevron" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor">
                  <path d="M4 6l4 4 4-4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </a>
              
              <div class="submenu" id="monitoringSubmenu">
                <a href="#" class="submenu-item">STATUS PERMOHONAN</a>
                <a href="#" class="submenu-item">LAPORAN</a>
              </div>
            </div>
          </nav>
        </aside>

        <!-- Content -->
        <div class="content-inner bg-white h-100">
          <div class="form-header">
            <div class="form-title">
              <h2>BUAT USER BARU</h2>
            </div>
            <div class="form-actions">
              <button class="btn-save">
                <i class="bi bi-floppy"></i>
                Save
              </button>
              <button class="btn-back" onclick="window.location.href='user.html'">
                <i class="bi bi-list-ul"></i>
                Back to list
              </button>
            </div>
          </div>

          <form class="user-form">
            <div class="form-row">
              <div class="form-group">
                <label for="nama">NAMA <span class="required">*</span></label>
                <input type="text" class="form-control" id="nama" placeholder="" required>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="username">USERNAME <span class="required">*</span></label>
                <input type="text" class="form-control" id="username" placeholder="" required>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="password">PASSWORD <span class="required">*</span></label>
                <input type="password" class="form-control" id="password" placeholder="" required>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="nomor_hp">NOMOR HP</label>
                <div class="phone-input-group">
                  <span class="phone-prefix">+62</span>
                  <input type="text" class="form-control phone-input" id="nomor_hp" placeholder="">
                </div>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="email">EMAIL <span class="required">*</span></label>
                <input type="email" class="form-control" id="email" placeholder="" required>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="group">GROUP <span class="required">*</span></label>
                <select class="form-control" id="group" required>
                  <option value="">-- Pilih Group --</option>
                  <option value="BLUD" selected>BLUD</option>
                  <option value="TIM PENILAI">TIM PENILAI</option>
                  <option value="OPD">OPD</option>
                  <option value="ADMINISTRATOR">ADMINISTRATOR</option>
                </select>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="active">ACTIVE</label>
                <div class="checkbox-wrapper">
                  <input type="checkbox" class="form-check-input" id="active" checked>
                </div>
              </div>
            </div>
          </form>

          <div class="form-footer">
            <button class="btn-save">
              <i class="bi bi-floppy"></i>
              Save
            </button>
            <button class="btn-back" onclick="window.location.href='user.html'">
              <i class="bi bi-list-ul"></i>
              Back to list
            </button>
          </div>
        </div>

      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Sidebar JS -->
    <script src="/assets/js/sidebar.js"></script>
    <script src="/assets/js/sidebar-submenu.js"></script>
  </body>
</html>
