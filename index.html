<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - BLUD Jawa Timur</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      background-image: url('assets/img/login.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed; 
    }

    .main-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 20px;
    }

    /* LEFT SECTION */
    .left-section {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 60px; /* Tambah padding kanan */
    }

    .logo-container {
      margin-bottom: 20px;
      padding-left: 90px; /* Geser logo ke kanan */
    }

    .logo-image {
      max-width: 500px;
      width: 100%;
      height: auto;
      display: block;
    }

    .tagline {
      white-space: nowrap;
      font-size: 17px;
      color: #1e3a8a;
      font-weight: 500;
      line-height: 1.5;
      max-width: 500px;
      padding-left: 100px; /* sejajar dengan logo */
    }

    /* RIGHT SECTION */
    .right-section {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      background: white;
      border-radius: 16px;
      padding: 40px 35px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 420px;
    }

    .login-title {
      font-size: 28px;
      font-weight: 700;
      color: #1e3a8a;
      text-align: center;
      margin-bottom: 30px;
    }

    .form-label {
      font-size: 14px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 8px;
    }

    .form-control {
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .form-control:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper .form-control {
      padding-right: 45px;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #64748b;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.3s ease;
      z-index: 10;
    }

    .toggle-password:hover {
      color: #1e3a8a;
    }

    .forgot-password {
      text-align: left;
      margin-bottom: 20px;
    }

    .forgot-password a {
      color: #1e3a8a;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
    }

    .btn-custom {
      padding: 12px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
    }

    .btn-primary-custom {
      background: #1e3a8a;
      color: white;
    }

    .btn-primary-custom:hover {
      background: #1e40af;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(30, 58, 138, 0.3);
    }

    .btn-secondary-custom {
      background: #f59e0b;
      color: #301E00;
    }

    .btn-secondary-custom:hover {
      background: #d97706;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
    }

    /* Responsive Tablet */
    @media (max-width: 991px) {
      .left-section {
        text-align: center;
        align-items: center;
        padding: 20px;
        margin-bottom: 20px;
      }

      .logo-container {
        padding-left: 0;
      }

      .logo-image {
        max-width: 320px;
      }

      .tagline {
        text-align: center;
        padding-left: 0;
        font-size: 15px;
      }

      .right-section {
        padding: 10px;
      }

      .login-card {
        max-width: 100%;
      }
    }

    /* Mobile */
    @media (max-width: 576px) {
      body {
        background-attachment: scroll;
      }

      .main-container {
        padding: 15px;
      }

      .left-section {
        padding: 15px;
        margin-bottom: 15px;
      }

      .logo-image {
        max-width: 240px;
      }

      .tagline {
        font-size: 13px;
      }

      .login-card {
        padding: 25px 20px;
        border-radius: 12px;
      }

      .login-title {
        font-size: 22px;
        margin-bottom: 20px;
      }

      .form-control {
        padding: 10px 12px;
        font-size: 13px;
      }

      /* Pusatkan tombol di mobile */
      .row.g-2 {
        justify-content: center;
        text-align: center;
      }

      .col-6 {
        flex: 0 0 80%;
        max-width: 80%;
      }

      .btn-custom {
        padding: 10px 14px;
        font-size: 13px;
      }
    }

    @media (max-width: 414px) {
      .logo-image {
        max-width: 200px;
      }

      .tagline {
        font-size: 12px;
        line-height: 1.4;
      }

      .login-card {
        padding: 20px 15px;
      }

      .col-6 {
        flex: 0 0 100%;
        max-width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="main-container">
    <div class="container-fluid">
      <div class="row align-items-center justify-content-center">
        <!-- Left Section -->
        <div class="col-lg-6 col-md-12 order-1 order-lg-1 left-section">
          <div class="logo-container">
            <img src="assets/img/Logo-BLUD.png" alt="BLUD Jawa Timur" class="logo-image" />
          </div>
          <p class="tagline">Kelola Badan Layanan Umum Daerah Anda di satu tempat</p>
        </div>

        <!-- Right Section -->
        <div class="col-lg-6 col-md-12 order-2 order-lg-2 right-section">
          <div class="login-card">
            <h1 class="login-title">Login</h1>
            <form id="loginForm">
              <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <input type="text" id="username" class="form-control" placeholder="Username" required />
              </div>

              <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <div class="password-wrapper">
                  <input type="password" id="password" class="form-control" placeholder="Password" required />
                  <button type="button" class="toggle-password" onclick="togglePassword()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                      <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                  </button>
                </div>
              </div>

              <div class="forgot-password">
                <a href="#" onclick="forgotPassword(event)">Lupa password?</a>
              </div>

              <div class="row g-2">
                <div class="col-6">
                  <button type="submit" class="btn-custom btn-primary-custom">Login</button>
                </div>
                <div class="col-6">
                  <button type="button" class="btn-custom btn-secondary-custom" onclick="loginAsAssessor()">Login as Tim Penilai</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    let isPasswordVisible = false;
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const toggleBtn = document.querySelector('.toggle-password');
      isPasswordVisible = !isPasswordVisible;
      if (isPasswordVisible) {
        passwordInput.type = 'text';
        toggleBtn.innerHTML = `
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>`;
      } else {
        passwordInput.type = 'password';
        toggleBtn.innerHTML = `
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>`;
      }
    }

    function forgotPassword(e) {
      e.preventDefault();
      alert('Silakan hubungi administrator untuk reset password.');
    }

    function loginAsAssessor() {
      alert('Login sebagai Tim Penilai');
      window.location.href = 'pages/penilai/data_permohonan_awal.html';
    }

    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      alert('Login berhasil!');
      window.location.href = 'dashboard.html';  
    });
  </script>
</body>
</html>
