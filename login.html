<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BLUD Jawa Timur</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body style="background-image: url('images/login.png'); background-size: cover; background-position: center; background-repeat: no-repeat;">
    <div class="container">
        <div class="left-section">
            <div class="logo-container">
                <img src="images/logo-blud.png" alt="BLUD Jawa Timur" class="logo-image">
            </div>
            <p class="tagline">Kelola Badan Layanan Umum Daerah Anda di satu tempat</p>
        </div>

        <div class="right-section">
            <div class="login-card">
                <h1 class="login-title">Login</h1>
                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label" for="username">Username</label>
                        <input type="text" id="username" class="form-input" placeholder="Username" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" class="form-input" placeholder="Password" required>
                            <button type="button" class="toggle-password" onclick="togglePassword()">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="captcha">Captcha</label>
                        <div class="captcha-container">
                            <div class="captcha-box">
                                <canvas id="captchaCanvas" width="170" height="50"></canvas>
                            </div>
                            <input type="text" id="captcha" class="form-input captcha-input" placeholder="Captcha" required>
                        </div>
                    </div>

                    <div class="forgot-password">
                        <a href="#" onclick="forgotPassword(event)">Lupa password?</a>
                    </div>

                    <div class="button-group">
                        <button type="submit" class="btn btn-primary">Login</button>
                        <button type="button" class="btn btn-secondary" onclick="loginAsAssessor()">Login as Tim Penilai</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
